<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>vm-mcp · sign in</title>
<style>
:root{color-scheme:dark;--bg:#0d1015;--panel:#131820;--line:#222b38;--text:#e7ebf1;--dim:#8893a3;--soft:#f3f5f9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
form{width:min(380px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
svg{width:30px;height:34px;display:block;margin-bottom:18px}h1{font-size:19px;margin:0 0 4px;font-weight:600}p{margin:0 0 18px;color:var(--dim);font-size:13.5px}
input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:#0d1118;color:var(--text);font:inherit;outline:none}
input:focus{border-color:#4a5a73}button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:10px;background:var(--soft);color:#10141b;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#fff}.bad{display:{{BAD}};color:#ff9c92;font-size:13px;margin-top:10px}
</style></head><body>
<form method="post" action="/ui/login">
<svg viewBox="-5 -6 93 112"><path d="M24.01 7.25 L69.86 45.61 Q99.00 70.00 61.00 70.00 L52.00 70.00 Q44.00 70.00 38.74 76.03 L29.29 86.86 Q3.00 117.00 2.38 77.00 L1.47 18.00 Q1.00 -12.00 24.01 7.25 Z" fill="#f3f5f9"/></svg>
<h1>vm-mcp dashboard</h1><p>Enter the server API key (<code>VM_MCP_API_KEY</code>).</p>
<input type="password" name="key" placeholder="API key" autofocus autocomplete="current-password">
<div class="bad">That key didn’t match.</div>
<button type="submit">Open dashboard</button></form></body></html>
